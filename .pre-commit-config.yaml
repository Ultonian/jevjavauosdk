# Pre-commit quality gate. Activate once per clone with:  pre-commit install --install-hooks
# The Maven step is the same gate CI runs (compile with -Werror, Checkstyle, tests, JaCoCo >=85%, SpotBugs).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/upstream/.*\.json$
      - id: end-of-file-fixer
        exclude: ^docs/upstream/.*\.json$
      - id: check-yaml
      - id: check-xml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^mvnw\.cmd$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        name: ruff (Python tooling)
        args: ["--config", "jev-benchmarks/scripts/ruff.toml"]
        files: ^(jev-benchmarks/scripts|scripts)/.*\.py$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: repository-checks
        name: repository links, contract pins and gate tests
        entry: python -B scripts/check_repository.py
        language: python
        pass_filenames: false
        files: (^scripts/|^config/quality/|\.md$|^pom\.xml$|^\.github/|^\.pre-commit-config\.yaml$)
      - id: trivy
        name: trivy (HIGH/CRITICAL vulnerabilities, config, secrets)
        entry: trivy fs --config trivy.yaml .
        language: system
        pass_filenames: false
        # Scan every commit: vulnerability advisories change independently of source files.
        always_run: true
      - id: benchmark-study-tests
        name: benchmark study script checks (no timed workloads)
        entry: python -B -m unittest discover -s jev-benchmarks/scripts -v
        language: python
        pass_filenames: false
        files: ^jev-benchmarks/scripts/.*\.py$
      - id: maven-verify
        name: mvn verify (spotless, checkstyle, tests, jacoco, javadoc, spotbugs)
        entry: ./mvnw --batch-mode --quiet --no-transfer-progress verify
        language: system
        pass_filenames: false
        # Unconditional: fixtures, schema copies and hook config all feed the tests.
        always_run: true
