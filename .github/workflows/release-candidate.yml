name: Release candidate

# Builds one signed, unpublished Central bundle from a release branch, proves it is reproducible,
# checks its exact contents and runs isolated consumers on the supported runtimes. Nothing is
# uploaded. The retained artifact is the only input to the promotion workflow.
#
# The toolchain is pinned below, not chosen at dispatch time, so the candidate's commit fully
# determines how it was built. Bump the pins by pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Explicit bash enables pipefail; the implicit shell is only `bash -e`, which would let a
    # failing command hide behind `| tee`.
    shell: bash

env:
  # setup-java resolves the newest Temurin build of each pinned patch version; the verification
  # step then requires java.runtime.version to match the expected build exactly.
  BUILD_JDK: "21.0.12"
  BUILD_JDK_RUNTIME: "21.0.12.1+1-LTS"
  CONSUMER_JDK: "25.0.4"
  CONSUMER_JDK_RUNTIME: "25.0.4.1+1-LTS"

jobs:
  candidate:
    name: Build and qualify the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Require a release branch
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/release/*) ;;
            *) echo "::error::Candidates are built from release/** only, not $REF"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the consumer runtime (JDK 25)
        id: jdk25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Without this the preinstalled Temurin in the runner's tool cache satisfies the patch
          # spec and the pinned build is never resolved against the Adoptium API.
          check-latest: true
          java-version: ${{ env.CONSUMER_JDK }}
      - name: Install the build runtime (JDK 21, last so that it owns JAVA_HOME)
        id: jdk21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Without this the preinstalled Temurin in the runner's tool cache satisfies the patch
          # spec and the pinned build is never resolved against the Adoptium API.
          check-latest: true
          java-version: ${{ env.BUILD_JDK }}
          cache: maven
      - name: Verify the resolved runtimes
        env:
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}
        run: |
          verify() {
            properties=$("$1/bin/java" -XshowSettings:properties -version 2>&1)
            vendor=$(printf '%s\n' "$properties" | sed -n 's/^ *java.vendor = //p')
            runtime=$(printf '%s\n' "$properties" | sed -n 's/^ *java.runtime.version = //p')
            echo "$1: $vendor $runtime"
            if [ "$vendor" != "Eclipse Adoptium" ] || [ "$runtime" != "$2" ]; then
              echo "::error::Expected Eclipse Adoptium $2 at $1, found '$vendor' '$runtime'"; exit 1
            fi
          }
          verify "$JDK21" "$BUILD_JDK_RUNTIME"
          verify "$JDK25" "$CONSUMER_JDK_RUNTIME"
          if [ "$JAVA_HOME" != "$JDK21" ]; then
            echo "::error::JAVA_HOME is $JAVA_HOME, not the build JDK $JDK21"; exit 1
          fi
      - name: Cache the Maven wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Resolve the candidate version
        id: version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().findtext('{*}version'))")
          case "$version" in
            *-SNAPSHOT|"") echo "::error::Release branch still declares $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build, sign and bundle (first build)
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -p candidate
          ./mvnw --batch-mode --no-transfer-progress -Prelease,release-checks,sbom clean deploy \
            2>&1 | tee candidate/build-1.log
          cp target/central-publishing/central-bundle.zip candidate/central-bundle.zip
          cp target/bom.json candidate/bom.json
      - name: Rebuild to prove reproducibility (second build)
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Prelease,release-checks,sbom -DskipTests clean deploy \
            2>&1 | tee candidate/build-2.log
          python3 -B scripts/release_bundle.py compare candidate/central-bundle.zip \
            target/central-publishing/central-bundle.zip
      - name: Check exact bundle contents and record the candidate identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -B scripts/release_bundle.py check candidate/central-bundle.zip --version "$VERSION" \
            --sbom candidate/bom.json --manifest candidate/manifest.json
          python3 - <<'EOF'
          import json, os
          path = 'candidate/manifest.json'
          manifest = json.load(open(path))
          manifest['buildJdk'] = 'Eclipse Adoptium ' + os.environ['BUILD_JDK_RUNTIME']
          manifest['consumerJdks'] = ['Eclipse Adoptium ' + os.environ[name]
                                      for name in ('BUILD_JDK_RUNTIME', 'CONSUMER_JDK_RUNTIME')]
          json.dump(manifest, open(path, 'w'), indent=2)
          EOF
      - name: Run isolated consumers against the bundle on JDK 21 and 25
        env:
          VERSION: ${{ steps.version.outputs.version }}
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}
        run: |
          python3 -B scripts/release_bundle.py consumer candidate/central-bundle.zip --version "$VERSION" \
            --runtime "$JDK21" --runtime "$JDK25" 2>&1 | tee candidate/consumer.log
      - name: Retain the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the unpublished final version out of the saved Maven cache
        if: always()
        run: rm -rf ~/.m2/repository/net/codefinch
      - name: Summarize the candidate identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Candidate $VERSION"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Workflow run | $GITHUB_RUN_ID |"
            echo "| Bundle SHA-256 | \`$(python3 -c "import json; print(json.load(open('candidate/manifest.json'))['bundle']['sha256'])")\` |"
            echo "| Build JDK | Eclipse Adoptium $BUILD_JDK_RUNTIME |"
            echo "| Consumer JDKs | Eclipse Adoptium $BUILD_JDK_RUNTIME, $CONSUMER_JDK_RUNTIME |"
            echo
            echo "Retained as artifact \`candidate-$VERSION-$(git rev-parse --short=12 HEAD)\` for 90 days; copy it to durable storage once accepted."
          } >> "$GITHUB_STEP_SUMMARY"
