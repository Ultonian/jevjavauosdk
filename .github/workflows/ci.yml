name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Cache the Maven wrapper distribution
        # setup-java caches ~/.m2/repository only; the wrapper downloads Maven itself into
        # ~/.m2/wrapper, and a transient fetch failure there failed a job once.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Verify (compile -Werror, Checkstyle, tests, JaCoCo, SpotBugs)
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Check public API compatibility
        if: matrix.java == '21'
        run: python3 -B scripts/api_compat.py
      - name: Upload JaCoCo report
        if: matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  pre-commit:
    name: pre-commit hooks (non-Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install pre-commit==4.7.0
      # Dedicated jobs run Maven and Trivy; local commits run both hooks.
      - run: SKIP=maven-verify,trivy pre-commit run --all-files

  trivy:
    name: Trivy (dependencies and config)
    # Wait for setup-java's post-build cache save before restoring Maven dependencies.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: java
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Populate Maven dependencies if the build cache is unavailable
        if: steps.java.outputs.cache-hit != 'true'
        # Resolve the whole reactor, including unpublished inter-module dependencies.
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests install
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  analysis:
    name: Error Prone (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress -Panalysis -pl jev-core,jev-test,jev-micrometer -am clean verify
      - name: Prove analysis and compatibility gates with deliberate failures
        run: python3 -B scripts/prove_gates.py

  runtime-probes:
    name: Advisory JDK ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The early-access probe fails whenever analysis tooling lags the EA class-file version; report
    # it as a warning instead of failing the scheduled run. Required support remains JDK 21/25.
    continue-on-error: ${{ matrix.runtime == 'ea' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["latest","ea"]' || '["latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve runtime
        id: runtime
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          if [ "$RUNTIME" = ea ]; then
            version=$(python3 -B scripts/monitor.py ea)
          else
            version=latest
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.runtime.outputs.version }}
          check-latest: true
          cache: maven
      - name: Record resolved runtime
        run: java -version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Surface advisory failure
        if: failure()
        run: |
          echo "::warning::Advisory runtime failed; this check is not required for merging."
          echo "Advisory runtime probe failed. Required support remains JDK 21/25." >> "$GITHUB_STEP_SUMMARY"
